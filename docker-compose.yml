services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/applyflow
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    expose:
      - "5000"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    volumes:
      - ./data/mongodb:/data/db
    expose:
      - "27017"
