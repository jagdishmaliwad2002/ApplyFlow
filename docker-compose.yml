services:

  frontend:
    image: 629229067219.dkr.ecr.us-east-1.amazonaws.com/applyflow-frontend:${IMAGE_TAG}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    image: 629229067219.dkr.ecr.us-east-1.amazonaws.com/applyflow-backend:${IMAGE_TAG}
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/applyflow
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    expose:
      - "5000"
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - ./data/mongodb:/data/db
    expose:
      - "27017"
    restart: unless-stopped
